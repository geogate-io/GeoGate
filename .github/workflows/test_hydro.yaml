name: Test Hydro Plugin

env:
  backend: osmesa
  catalyst: 2.1.0
  conduit: 0.9.7
  compiler: gcc@14.2.0
  coupling: spmd
  esmf: 8.8.0
  paraview: 6.1.1
  python: 3.12.13
  spack: v1.2.1
  esmx_np: 4

on:
  workflow_dispatch:
    inputs:
      esmf:
        description: 'ESMF version, branch or tag like 8.8.0, develop or =8.5.0b23'
        required: false
        type: string
        default: '8.8.0'
      spack:
        description: 'Spack version'
        required: false
        type: string
        default: 'v1.2.1'
  push:
    branches: [ main ]
    paths:
      - 'src/plugins/hydro/**'
      - 'src/geogate_nuopc.F90'
      - '.github/workflows/test_hydro.yaml'
      - '.github/workflows/config/hydro/**'
      - '.github/actions/fetch_hydro_data/**'
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    branches: [ main ]
    paths:
      - 'src/plugins/hydro/**'
      - 'src/geogate_nuopc.F90'
      - '.github/workflows/test_hydro.yaml'
      - '.github/workflows/config/hydro/**'
      - '.github/actions/fetch_hydro_data/**'
  schedule:
    - cron: '0 0 * * WED'

jobs:
  run-app:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
    - name: Checkout Component Repository
      uses: actions/checkout@v4
      with:
        path: ${{ github.workspace }}/app/geogate

    - name: Create Run Environment
      id: create-env
      uses: ./app/geogate/.github/actions/create_env
      with:
        backend: ${{ env.backend }}
        catalyst: ${{ env.catalyst }}
        conduit: ${{ env.conduit }}
        compiler: ${{ env.compiler }}
        esmf: ${{ inputs.esmf || env.esmf }}
        install_dir: ${{ github.workspace }}/app
        paraview: ${{ env.paraview }}
        python: ${{ env.python }}
        spack: ${{ inputs.spack || env.spack }}

    - name: Install GeoGate
      id: install-geogate
      uses: ./app/geogate/.github/actions/install_geogate
      with:
        compiler: ${{ env.compiler }}
        install_dir: ${{ github.workspace }}/app
        spack_dir: ${{ github.workspace }}/app/spack
        use_python: OFF
        use_catalyst: OFF
        use_hydro: ON

    - name: Fetch Hydro Test Data
      uses: ./app/geogate/.github/actions/fetch_hydro_data
      with:
        install_dir: ${{ github.workspace }}/app
        geogate_dir: ${{ github.workspace }}/app/geogate
        start: '2021-06-01T00:00'
        end: '2021-06-01T03:00'

    - name: Create Executable with ESMX
      run: |
        cd ${{ github.workspace }}/app
        . ${{ github.workspace }}/app/spack/share/spack/setup-env.sh
        . $(spack location -i lmod)/lmod/lmod/init/bash
        spack env activate test
        module load esmf
        module load libcatalyst
        module load conduit
        module load parallelio
        export COMPILER_MAJOR_VER=`echo ${{ env.compiler }} | awk -F@ '{print $2}' | awk -F. '{print $1}'`
        export FC=/usr/bin/gfortran-$COMPILER_MAJOR_VER
        export CC=/usr/bin/gcc-$COMPILER_MAJOR_VER
        export CXX=/usr/bin/g++-$COMPILER_MAJOR_VER
        export esmf_ROOT=`cat $ESMFMKFILE | grep ESMF_LIBSDIR | awk -F= '{print $2}'`
        python_bin="$(spack location -i python)/bin/python3"
        python_static_lib=`$python_bin ${{ github.workspace }}/app/geogate/.github/actions/case_run/find_python.py | awk -F: '{print $2}' | tr -d ' '`
        python_ver=$(basename "$python_static_lib" | sed -E 's/^libpython//; s/\.(a|so)$//')
        echo "::group::Create esmxBuild.yaml"
        echo "application:" > esmxBuild.yaml
        echo "  disable_comps: ESMX_Data" >> esmxBuild.yaml
        echo "  link_libraries: stdc++ piof conduit catalyst catalyst_fortran python${python_ver}" >> esmxBuild.yaml
        echo "  link_paths: $python_static_lib /usr/lib/gcc/x86_64-linux-gnu/$COMPILER_MAJOR_VER" >> esmxBuild.yaml
        echo "components:" >> esmxBuild.yaml
        echo "  geogate:" >> esmxBuild.yaml
        echo "    build_type: none" >> esmxBuild.yaml
        echo "    install_prefix: ${{ github.workspace }}/app/geogate/install" >> esmxBuild.yaml
        echo "    libraries: geogate geogate_io geogate_hydro geogate_python geogate_catalyst geogate_shared" >> esmxBuild.yaml
        echo "    fort_module: geogate_nuopc.mod" >> esmxBuild.yaml
        echo "    link_paths: $esmf_ROOT/lib" >> esmxBuild.yaml
        echo "    link_libraries: esmf" >> esmxBuild.yaml
        echo "::endgroup::"
        echo "::group::Content of esmxBuild.yaml"
        cat esmxBuild.yaml
        ESMX_Builder --verbose
        echo "::endgroup::"
      shell: bash

    - name: Prepare Run Directory
      run: |
        cd ${{ github.workspace }}/app
        ln -sf geogate/.github/workflows/config/hydro/hydro_config_ci.yaml .
        ln -sf geogate/.github/workflows/config/hydro/mapping.txt .
        ln -sf geogate/.github/workflows/config/hydro/hgrid_ESMF.nc .
        wget --no-verbose https://raw.githubusercontent.com/oceanmodeling/ufs-weather-model/refs/heads/feature/coastal_app/tests/parm/fd_ufs.yaml
      shell: bash

    - name: Run Case
      run: |
        cd ${{ github.workspace }}/app
        . ${{ github.workspace }}/app/spack/share/spack/setup-env.sh
        . $(spack location -i lmod)/lmod/lmod/init/bash
        spack env activate test
        module load esmf
        module load parallelio
        cp geogate/.github/workflows/config/hydro/esmxRun.yaml .
        cat esmxRun.yaml
        echo "::group::Run simulation"
        ulimit -s unlimited
        mpirun --oversubscribe -np ${{ env.esmx_np }} --mca btl_tcp_if_include eth0 ${{ github.workspace }}/app/install/bin/esmx_app 2>&1 | tee out_err.txt
        echo "::endgroup::"
      shell: bash

    - name: Install Plotting Dependencies
      run: |
        sudo apt-get -qq update
        sudo apt-get -qq install libgeos-dev libproj-dev proj-bin
        python3 -m pip install --user --quiet numpy matplotlib cartopy pillow
      shell: bash

    - name: Plot and Validate Hydro Export
      run: |
        cd ${{ github.workspace }}/app
        python3 geogate/src/plugins/hydro/tools/plot_export_map.py \
          --vtk-dir . --mapping-file mapping.txt --output export_map.png
      shell: bash

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      if: ${{ always() }}
      with:
        name: run
        path: |
          ${{ github.workspace }}/app/*.png
          ${{ github.workspace }}/app/*.vtk
          ${{ github.workspace }}/app/out_err.txt
          ${{ github.workspace }}/app/*.log
        retention-days: 2
